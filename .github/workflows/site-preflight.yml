name: Website preflight and OmniGuard presence
on:
  push:
    branches: [main, 'chore/**', 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: python3 scripts/check_site.py .
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check shared.js && node --check project-demos.js && node --check assessment-form.js && node --check film-play.js
      - name: Verify OmniGuard project page and homepage link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.links.append(dict(attrs).get('href',''))
          home=Links();home.feed(Path('index.html').read_text())
          assert 'omniguard.html' in home.links, 'Homepage must link to OmniGuard'
          page=Path('omniguard.html').read_text()
          assert 'WeDoCareGlobal/OmniGuard-Next' in page, 'OmniGuard page must link to repository'
          assert 'Development preview' in page, 'Do not misrepresent preview as production-ready'
          print('OmniGuard presence and disclosure verified')
          PY
